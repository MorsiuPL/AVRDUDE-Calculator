<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AVRDUDE Calculator</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
            text-align: center;
        }

        header {
            padding: 70px 20px 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .version {
            color: #aaa;
            font-size: 18px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: #191c22;

            padding: 35px;

        .description {
            color: #ccc;
            line-height: 1.6;
            font-size: 17px;
        }

        .download {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;

            color: #111;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .download:hover {
            transform: scale(1.04);
        }

        .info {
            margin-top: 25px;
            color: #999;
            font-size: 14px;
        }

        footer {
            margin-top: 60px;
            padding: 25px;
            color: #777;

        }

    <header>
        <h1>AVRDUDE Calculator</h1>

            <p class="description">
                AVRDUDE Calculator to program pomocniczy do pracy z AVRDUDE,
                Arduino CLI oraz narzędziami programistycznymi.

            <a

                rel="noopener noreferrer">

                Instalator dla Windows · około 28 MB

    <footer>
        AVRDUDE Calculator © 2026
