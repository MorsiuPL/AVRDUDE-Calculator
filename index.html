<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AVRDUDE Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1115;
            color: white;
        }

        header {
            text-align: center;
            padding: 80px 20px 50px;
        }

        h1 {
            margin: 0;
            font-size: 52px;
        }

        .subtitle {
            margin-top: 12px;
            color: #aaa;
            font-size: 19px;
        }

        .language {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: #191c22;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 5px;
        }

        .language button {
            border: 0;
            background: transparent;
            color: #aaa;
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .language button.active {
            background: white;
            color: #111;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: #191c22;
            border: 1px solid #242832;
            border-radius: 18px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-top: 0;
            font-size: 30px;
        }

        .description {
            color: #ccc;
            line-height: 1.7;
            font-size: 17px;
        }

        .main-buttons {
            margin-top: 20px;
        }

        .download-main,
        .source-main {
            display: inline-block;
            padding: 15px 28px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .download-main {
            background: white;
            color: #111;
        }

        .source-main {
            margin-left: 8px;
            border: 1px solid #444;
            color: white;
        }

        .download-main:hover,
        .source-main:hover {
            transform: translateY(-2px);
        }

        .source-main:hover {
            background: #22252c;
        }

        .release {
            background: #111318;
            border: 1px solid #292d36;
            border-radius: 14px;
            padding: 22px;
            margin-top: 16px;
        }

        .latest {
            display: inline-block;
            color: #7dd3fc;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .release h3 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .date {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .release-description {
            color: #ccc;
            line-height: 1.5;
        }

        .release-buttons {
            margin-top: 18px;
        }

        .release-buttons a {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 8px;
            padding: 10px 15px;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            text-decoration: none;
        }

        .release-buttons a:hover {
            background: #22252c;
        }

        .empty {
            color: #888;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 40px 20px;
        }

        @media (max-width: 650px) {

            h1 {
                font-size: 38px;
            }

            .card {
                padding: 25px;
            }

            .download-main,
            .source-main {
                display: block;
                width: 100%;
                margin: 10px 0 0;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- JĘZYK -->

    <div class="language">

        <button
            id="plButton"
            onclick="changeLanguage('pl')">

            PL

        </button>

        <button
            id="enButton"
            onclick="changeLanguage('en')">

            EN

        </button>

    </div>


    <!-- NAGŁÓWEK -->

    <header>

        <h1>
            AVRDUDE Calculator
        </h1>

        <div
            class="subtitle"
            id="subtitle">

            Narzędzia dla AVRDUDE i Arduino CLI

        </div>

    </header>


    <main class="container">


        <!-- O PROGRAMIE -->

        <section class="card">

            <h2 id="aboutTitle">
                O programie
            </h2>

            <p
                class="description"
                id="aboutText">

                AVRDUDE Calculator to program pomocniczy
                do pracy z AVRDUDE oraz Arduino CLI.

            </p>


            <div class="main-buttons">


                <!-- NAJNOWSZY INSTALATOR -->

                <a
                    id="mainDownload"
                    class="download-main"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer">

                    Pobierz najnowszą wersję

                </a>


                <!-- NAJNOWSZY KOD ŹRÓDŁOWY -->

                <a
                    id="mainSource"
                    class="source-main"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer">

                    Pobierz najnowszy kod źródłowy

                </a>

            </div>

        </section>



        <!-- RELEASES -->

        <section class="card">

            <h2 id="releasesTitle">
                Releases
            </h2>

            <div id="releases">

                Ładowanie wersji...

            </div>

        </section>

    </main>


    <footer>

        AVRDUDE Calculator © 2026

    </footer>



<script>


let currentLanguage = "pl";

let releasesData = [];



/*
    TŁUMACZENIA
*/


const translations = {


    pl: {

        subtitle:
            "Narzędzia dla AVRDUDE i Arduino CLI",

        aboutTitle:
            "O programie",

        aboutText:
            "AVRDUDE Calculator to program pomocniczy do pracy z AVRDUDE oraz Arduino CLI.",

        downloadLatest:
            "Pobierz najnowszą wersję",

        downloadSourceLatest:
            "Pobierz najnowszy kod źródłowy",

        releasesTitle:
            "Releases",

        latest:
            "NAJNOWSZA WERSJA",

        download:
            "Pobierz instalator",

        source:
            "Kod źródłowy",

        loading:
            "Ładowanie wersji...",

        noReleases:
            "Brak dostępnych wersji.",

        releaseDate:
            "Data wydania"

    },


    en: {

        subtitle:
            "Tools for AVRDUDE and Arduino CLI",

        aboutTitle:
            "About",

        aboutText:
            "AVRDUDE Calculator is a utility program for working with AVRDUDE and Arduino CLI.",

        downloadLatest:
            "Download latest version",

        downloadSourceLatest:
            "Download latest source code",

        releasesTitle:
            "Releases",

        latest:
            "LATEST VERSION",

        download:
            "Download installer",

        source:
            "Source code",

        loading:
            "Loading releases...",

        noReleases:
            "No releases available.",

        releaseDate:
            "Release date"

    }

};



/*
    ZMIANA JĘZYKA
*/


function changeLanguage(language) {


    currentLanguage = language;


    const t =
        translations[language];


    document.documentElement.lang =
        language;


    document.getElementById(
        "subtitle"
    ).textContent =
        t.subtitle;


    document.getElementById(
        "aboutTitle"
    ).textContent =
        t.aboutTitle;


    document.getElementById(
        "aboutText"
    ).textContent =
        t.aboutText;


    document.getElementById(
        "mainDownload"
    ).textContent =
        t.downloadLatest;


    document.getElementById(
        "mainSource"
    ).textContent =
        t.downloadSourceLatest;


    document.getElementById(
        "releasesTitle"
    ).textContent =
        t.releasesTitle;


    document.getElementById(
        "plButton"
    ).classList.toggle(
        "active",
        language === "pl"
    );


    document.getElementById(
        "enButton"
    ).classList.toggle(
        "active",
        language === "en"
    );


    displayReleases();

}



/*
    ŁADOWANIE RELEASES.JSON
*/


async function loadReleases() {


    try {


        const response =
            await fetch(
                "releases.json?cache=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Nie można załadować releases.json"
            );

        }


        releasesData =
            await response.json();


        /*
            PIERWSZY ELEMENT
            = NAJNOWSZA WERSJA
        */


        if (releasesData.length > 0) {


            /*
                NAJNOWSZY INSTALATOR
            */

            document.getElementById(
                "mainDownload"
            ).href =
                releasesData[0].installer;



            /*
                NAJNOWSZY KOD ŹRÓDŁOWY
            */

            document.getElementById(
                "mainSource"
            ).href =
                releasesData[0].source;

        }


        displayReleases();


    }


    catch (error) {


        console.error(error);


        document.getElementById(
            "releases"
        ).innerHTML =

            '<div class="empty">' +

            translations[
                currentLanguage
            ].noReleases +

            '</div>';

    }

}



/*
    WYŚWIETLANIE RELEASES
*/


function displayReleases() {


    const container =
        document.getElementById(
            "releases"
        );


    const t =
        translations[
            currentLanguage
        ];


    container.innerHTML = "";



    if (!releasesData.length) {


        container.innerHTML =

            '<div class="empty">' +

            t.noReleases +

            '</div>';


        return;

    }



    releasesData.forEach(
        (release, index) => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "release";



            /*
                NAJNOWSZA WERSJA
            */


            let latest = "";


            if (index === 0) {


                latest =

                    '<div class="latest">' +

                    t.latest +

                    '</div>';

            }



            /*
                OPIS
            */


            const description =

                currentLanguage === "pl"

                    ? release.description_pl

                    : release.description_en;



            /*
                HTML RELEASE
            */


            div.innerHTML = `


                ${latest}


                <h3>

                    AVRDUDE Calculator

                    ${escapeHTML(
                        release.version
                    )}

                </h3>


                <div class="date">

                    ${t.releaseDate}:

                    ${escapeHTML(
                        release.date
                    )}

                </div>


                <div class="release-description">

                    ${escapeHTML(
                        description
                    )}

                </div>


                <div class="release-buttons">


                    <a
                        href="${escapeAttribute(
                            release.installer
                        )}"
                        target="_blank"
                        rel="noopener noreferrer">

                        ${t.download}

                    </a>


                    <a
                        href="${escapeAttribute(
                            release.source
                        )}"
                        target="_blank"
                        rel="noopener noreferrer">

                        ${t.source}

                    </a>


                </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}



/*
    ZABEZPIECZENIE TEKSTU
*/


function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/*
    ZABEZPIECZENIE LINKU
*/


function escapeAttribute(text) {

    return String(text)
        .replaceAll(
            '"',
            "%22"
        );

}



/*
    START
*/


changeLanguage("pl");

loadReleases();


</script>

</body>
</html>
